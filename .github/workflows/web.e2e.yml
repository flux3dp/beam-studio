name: e2e

on:
  pull_request:
  workflow_dispatch:
    inputs:
      debug_artifacts:
        description: Record and upload Cypress videos
        type: boolean
        default: false


concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build job - runs once and shares artifact with all test machines
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter=web --filter=core

      - name: Build web app (dev mode)
        run: pnpm --filter=web build:dev

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  # Test jobs - download pre-built artifact and run tests in parallel
  e2e-test:
    needs: build
    runs-on: windows-latest
    env:
      DEBUG_ARTIFACTS: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug_artifacts) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-debug')) }}
      CYPRESS_CACHE_FOLDER: C:/Users/runneradmin/AppData/Local/Cypress/Cache
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        # Each runner receives a disjoint spec list (no Cypress Cloud).
        containers: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Copy pnpm-lock.yaml
        run: cp ../../pnpm-lock.yaml .
        working-directory: apps/web

      # Install dependencies (needed for Cypress)
      - name: Install dependencies
        working-directory: apps/web
        run: |
          pnpm install --filter=web --filter=core
          pnpm exec cypress install

      - name: Install serve
        run: npm install -g serve

      - name: Select specs for this runner
        id: specs
        working-directory: apps/web
        run: node scripts/cy-shard.mjs ${{ matrix.containers }} ${{ strategy.job-total }}

      - name: Run e2e tests
        uses: cypress-io/github-action@v7
        env:
          CYPRESS_username: ${{ secrets.CYPRESS_USERNAME }}
          CYPRESS_password: ${{ secrets.CYPRESS_PASSWORD }}
        with:
          install: false
          working-directory: apps/web
          config-file: cypress.config.ci.ts
          record: false
          spec: ${{ steps.specs.outputs.specs }}
          config: video=${{ env.DEBUG_ARTIFACTS }}
          start: serve dist -l 8080 -s
          wait-on: "http://localhost:8080"
          wait-on-timeout: 60

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.containers }}-attempt-${{ github.run_attempt }}
          path: |
            apps/web/cypress/results/
            apps/web/cypress/screenshots/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload debug videos
        if: ${{ always() && env.DEBUG_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-videos-${{ matrix.containers }}-attempt-${{ github.run_attempt }}
          path: apps/web/cypress/videos/
          retention-days: 3
          if-no-files-found: ignore
